<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>下午茶轉盤</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- 標題區 -->
      <header class="header">
        <h1>🎡 <span class="gradient-text">下午茶轉盤</span></h1>
        <p class="subtitle">想不到下午茶吃啥？來轉盤吧！</p>
      </header>

      <!-- 主要內容區 -->
      <main class="main-content">
        <!-- 轉盤區域 -->
        <div class="wheel-section">
          <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas"></canvas>
          </div>

          <div class="controls">
            <button id="spinBtn" class="btn btn-primary">
              <span class="btn-icon">🎲</span>
              <span>開始抽獎</span>
            </button>
            <button id="reloadBtn" class="btn btn-secondary">
              <span class="btn-icon">🔄</span>
              <span>重新載入</span>
            </button>
            <button id="selectFileBtn" class="btn btn-secondary">
              <span class="btn-icon">📁</span>
              <span>選擇檔案</span>
            </button>
          </div>
        </div>

        <!-- 結果顯示區 -->
        <div class="result-section">
          <div id="resultCard" class="result-card hidden">
            <div class="result-header">
              <h2>🎉 抽到了！</h2>
            </div>
            <div class="result-content">
              <div class="shop-name" id="shopName">-</div>
              <div class="shop-details">
                <div class="detail-item">
                  <span class="detail-label">📞 電話</span>
                  <span class="detail-value" id="shopPhone">-</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">🌐 網址</span>
                  <a href="#" id="shopUrl" class="detail-link" target="_blank"
                    >點擊開啟</a
                  >
                </div>
              </div>
            </div>
          </div>

          <!-- 資訊卡片 -->
          <div class="info-card">
            <div class="info-item">
              <span class="info-label">📊 總店家數</span>
              <span class="info-value" id="totalShops">0</span>
            </div>
            <div class="info-item">
              <span class="info-label">📄 檔案路徑</span>
              <span class="info-value small" id="filePath">未載入</span>
            </div>
          </div>
        </div>
      </main>

      <!-- 頁尾 -->
      <footer class="footer">
        <p>使用 Electron 建置 | 資料來源：Excel 檔案</p>
      </footer>
    </div>

    <script src="wheel.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
